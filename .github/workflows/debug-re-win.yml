# Reproducer for the sweep-re windows http_archive failure.
# Bisection so far: same-box windows = 300/300 PASS; cross-runner windows =
# 7582/7582 FAIL ("The system cannot find the path specified.", empty stdout);
# cross-runner linux = PASS. This rig is the failing combination — two
# runners — with keep-scratch forensics on the worker side.
name: debug-re-win
on:
  workflow_dispatch: {}
  push:
    branches: [giles-rebuck2-sweep]
    paths: [.github/workflows/debug-re-win.yml]

permissions:
  contents: read

env:
  BUCK2_VERSION: 2026-06-01
  REBUCK2_GIT: https://github.com/gilescope/rebuck
  REBUCK2_BRANCH: giles-iroh-re-punch

jobs:
  driver:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install buck2
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-pc-windows-msvc.exe.zst" | zstd -d > "$HOME/bin/buck2.exe"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      - name: Start driver (cross-runner worker required)
        run: |
          rebuck2 driver --grpc-port 9092 --min-workers 1 --no-local-exec \
            --session "debug-$GITHUB_RUN_ID" \
            --store "$HOME/.cache/rebuck2/driver" > driver.log 2>&1 &
          echo $! > driver.pid
          for _ in $(seq 1 120); do
            grep -q "worker 1 joined" driver.log && exit 0
            kill -0 "$(cat driver.pid)" || { cat driver.log; echo "driver died"; exit 1; }
            sleep 5
          done
          cat driver.log; echo "worker never joined"; exit 1

      - name: Point buck2 at rebuck2
        run: |
          cat > .buckconfig.local <<'EOF'
          [build]
          execution_platforms = fixups//platforms:re-exec-win

          [buck2_re_client]
          action_cache_address = grpc://127.0.0.1:9092
          cas_address = grpc://127.0.0.1:9092
          engine_address = grpc://127.0.0.1:9092
          tls = false
          EOF

      - name: Build 300 http_archive targets on the remote worker
        run: |
          buck2 uquery "kind('^http_archive\$', //third-party:)" > all-targets.txt
          head -300 all-targets.txt > targets.txt
          buck2 build --keep-going @targets.txt 2>&1 | tee build.log || true
          grep -cE "Action failed" build.log || true
          grep -E "Commands:" build.log || true

      - name: Stop driver (lets the worker exit and run its forensics)
        if: always()
        run: kill "$(cat driver.pid)" 2>/dev/null || true

      - name: Upload driver logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-driver-logs
          path: |
            driver.log
            build.log

  worker:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      - name: Serve (keep scratch) until the driver disconnects
        run: |
          REBUCK2_KEEP_SCRATCH=1 timeout 2100 rebuck2 worker \
            --session "debug-$GITHUB_RUN_ID" --connect-wait-secs 1200 \
            --store "$HOME/.cache/rebuck2/worker" 2>&1 | tee worker.log || true

      - name: Worker-side forensics
        if: always()
        run: |
          set +e
          echo "=== action results (first 6 + failures) ==="
          grep "\[exec\]" worker.log > execlog.txt
          head -6 execlog.txt
          grep "exit=Some" execlog.txt | grep -v "exit=Some(0)" > fails.txt
          echo "failed actions: $(wc -l < fails.txt)"
          p=$(head -1 fails.txt | sed 's/.*scratch kept at //')
          if [ -z "$p" ]; then
            echo "(no failures — dumping a passing dir instead)"
            p=$(grep "scratch kept at" execlog.txt | head -1 | sed 's/.*scratch kept at //')
          fi
          pu=$(cygpath -u "$p")
          echo "--- exec dir: $pu"
          find "$pu" | head -60
          bat=$(find "$pu" -name "*_unpack.bat" | head -1)
          if [ -n "$bat" ]; then
            echo "--- bat content:"; cat "$bat"
            echo "--- hexdump head (line endings / BOM):"; head -c 200 "$bat" | od -c | head -8
            echo "--- manual re-run from exec root:"
            (cd "$pu" && cmd //c "$(cygpath -w "$bat")"); echo "manual rc=$?"
          fi
          echo "--- disk:"; df -h /c || true

      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-worker-logs
          path: worker.log
