# Federated CAS bank compaction (ci/cas-bank-design.md): per range,
# re-bin the range's segments into full packs and publish a fresh
# range manifest. One matrix job per range - a range's failure leaves
# its old manifest as HEAD and touches nothing else.
#
# Runs OUTSIDE the sweep but shares its concurrency group so a range
# manifest never has two writers (the sweep's owner or this job).
#
# Provenance: restore only trusts manifests whose publishing run has
# head_branch == lineage. schedule events always run on the default
# branch, so the weekly tick re-dispatches this workflow on the
# lineage ref instead of compacting directly.
name: cas-compact
on:
  workflow_dispatch:
    inputs:
      force:
        description: Compact even if thresholds say no
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC

permissions:
  contents: read

concurrency:
  group: sweep-hetero
  cancel-in-progress: false

env:
  CAS_LINEAGE: ${{ github.ref_name }}
  SEG_MAX_MB: "64"
  COMPACT_DELTA_PCT: "20"
  COMPACT_HYSTERESIS_PCT: "5"
  COMPACT_MIN_MB: "256"
  COMPACT_MAX_SEGMENTS: "64"
  # Referenced containers older than this force a re-bin: fresh uploads
  # reset the 90d artifact-retention clock (the bank's only GC).
  REWARM_DAYS: "60"
  BANK_LINEAGE_REF: giles-rebuck2-sweep

jobs:
  # Weekly tick lands on the default branch - bounce to the lineage ref
  # so the compacted manifests pass the provenance check.
  redispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch on the lineage ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cas-compact.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$BANK_LINEAGE_REF"
          echo "dispatched cas-compact on $BANK_LINEAGE_REF"

  compact:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        range: [0, 1, 2, 3, 4, 5, 6, 7]
    name: compact r${{ matrix.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The re-bin's per-blob hot paths live in ci/cas-bank-tool (rust,
      # zero deps, built on demand by cas-bank.sh).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"

      # Manifests only ('-' seeds nothing): enough to decide, cheap
      # when the answer is no.
      - name: Decide (thresholds + rewarm)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          rc=0; ./ci/cas-bank-restore.sh "$(mktemp -d)" "-" || rc=$?
          m="$BANK_WORK/bank-manifest-r${{ matrix.range }}.json"
          if [ "$rc" -eq 3 ] || [ ! -f "$m" ]; then
            echo "no manifest for range ${{ matrix.range }} - nothing to compact"
            echo "go=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          verdict=$(./ci/cas-bank.sh needs_compaction "$m")
          echo "needs_compaction r${{ matrix.range }}: $verdict"
          go=0
          case "$verdict" in yes*) go=1 ;; esac
          if [ "$go" -eq 0 ]; then
            cutoff=$(date -u -d "$REWARM_DAYS days ago" +%s)
            for c in $(jq -r '[.segments[].artifact] | unique | .[]' "$m"); do
              created=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$c&per_page=1" \
                --jq '[.artifacts[] | select(.expired == false)][0].created_at // empty' \
                2>/dev/null || true)
              [ -n "$created" ] || continue
              if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
                echo "rewarm: $c created $created is older than ${REWARM_DAYS}d"
                go=1; break
              fi
            done
          fi
          [ "$FORCE" = "true" ] && { echo "forced"; go=1; }
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Re-bin range into full packs
        if: steps.decide.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          # Compaction is also an absorption point: pending spills for
          # this range fold into the fresh packs.
          ABSORB_SPILLS: "1"
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          ./ci/cas-bank-restore.sh "$RUNNER_TEMP/range-store" "${{ matrix.range }}"
          ./ci/cas-bank.sh compact "$RUNNER_TEMP/range-store" "$RUNNER_TEMP/packs" \
            > "$RUNNER_TEMP/packs.names"
          echo "packed $(wc -l < "$RUNNER_TEMP/packs.names" | tr -d ' ') full segments"
          CONTAINER="cas-segs-$CAS_LINEAGE-$GITHUB_RUN_ID-compact-r${{ matrix.range }}"
          mkdir -p "$RUNNER_TEMP/container"
          for d in "$RUNNER_TEMP"/packs/cas-seg-*/; do
            seg=$(basename "$d")
            mkdir -p "$RUNNER_TEMP/container/$seg"
            mv "$d/bulk.tar.zst" "$RUNNER_TEMP/container/$seg/"
            jq -c --arg a "$CONTAINER" '. + {artifact: $a}' "$d/meta.json" \
              > "$d/meta.json.tmp" && mv "$d/meta.json.tmp" "$d/meta.json"
          done
          old="$BANK_WORK/bank-manifest-r${{ matrix.range }}.json"
          parent_l=$(jq -r '.parent_lineage // "-"' "$old")
          parent_g=$(jq -r '.parent_generation // "-"' "$old")
          ./ci/cas-bank.sh write_manifest "$CAS_LINEAGE" "$GITHUB_RUN_ID-1" \
            "$parent_l" "$parent_g" "$GITHUB_RUN_ID" - \
            "$RUNNER_TEMP/packs" "$RUNNER_TEMP/manifest-out"
          # Monotonicity gate: re-binning + absorption may only GROW the
          # range's blob list. A shrink means a referenced container
          # failed to restore - fail and leave the old manifest as HEAD.
          in=$(zstd -dq -c "$BANK_WORK/own-range/blobs.txt.zst" | wc -l | tr -d ' ')
          out=$(zstd -dq -c "$RUNNER_TEMP/manifest-out/blobs.txt.zst" | wc -l | tr -d ' ')
          if [ "$out" -lt "$in" ]; then
            echo "blob count shrank: manifest=$in repacked=$out - refusing to publish"
            exit 1
          fi
          echo "manifest staged: $out blobs (was $in)"

      - name: Upload container
        id: upcontainer
        if: steps.decide.outputs.go == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-segs-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-compact-r${{ matrix.range }}
          path: ${{ runner.temp }}/container
          compression-level: 0

      # Self-verified by step order: the fresh manifest only uploads
      # once the container it references landed.
      - name: Publish range manifest
        if: steps.decide.outputs.go == '1' && steps.upcontainer.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-manifest-${{ env.CAS_LINEAGE }}-r${{ matrix.range }}
          path: ${{ runner.temp }}/manifest-out
