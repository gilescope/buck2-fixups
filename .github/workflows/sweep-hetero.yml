# Heterogeneous sweep: ONE rebuck2 driver + a mixed win/linux/mac fleet.
# WARM READER on the first clean-era pool (banked by 29089941213,
# 68m52s: quorum 50s / legs 64m33s / finalize 2m05s).
# Lap N+1: parallel verify-cas (the 31-min windows sequential hash was
# the join race behind BOTH the 23k-unservable class and the 31-min
# win-leg stall) + engine 835401b-era (memo + sync-24).
# ITERATION MODE: tiny curated target list (serde_json/tokio/spin/ahash/
# hex closures, ~150 crates) so a lap is minutes, not an hour - optimise
# the machinery here, then crank the list back to //third-party: +
# conflict rigs for the full sweep.
# The driver box runs three concurrent buck2 invocations (one per target OS,
# separate isolation dirs) against the same localhost driver; rebuck2 routes
# each action to a worker whose OS/arch matches the exec platform's REAPI
# properties. One store, one action cache, one mesh.
#
# v1 caveat: local_only toolchain discovery (vswhere-class) runs beside the
# driver, so it is native only for the windows leg - the driver is windows.
# linux/mac cxx-discovery failures land in those legs' expected lists.
# Snapshot rigs stay excluded (base + conflict rigs only).
# roadmap #9: fleet-sharded snapshots — workers restore + save CAS shards;
# the driver owns only the AC and dice. Finalize handoff post-build.
# take 4: cross legs pure-remote - hybrid ran linux compiles on the win box.
# goal run: healing 3 - full engine (validated AC, read-through, affinity,
# parallel probes, canonical materialization). Heals writer5 seeds then the
# next run is the measured reader.
# - unservable results re-execute and self-heal the artifact-hosted shards.
# size_bytes deferral, AC-only driver seed. The reader after this one is the
# measured hetero time.
name: sweep-hetero
on:
  workflow_dispatch: {}
  push:
    branches: [giles-rebuck2-sweep]
    paths:
      - .github/workflows/sweep-hetero.yml

permissions:
  contents: read

concurrency:
  group: sweep-hetero
  cancel-in-progress: false

env:
  BUCK2_VERSION: 2026-06-01
  USE_DEV_DRIVE: "1"
  REBUCK2_GIT: https://github.com/gilescope/rebuck
  REBUCK2_BRANCH: giles-iroh-re-punch
  # healing5 (same storm on e3a985f) exonerated canonical exec dirs; the
  # true cause was the stale provider index, fixed engine-side in 82f99b3
  # (index entries are HasMany-verified hints; serve path walks index ->
  # bloom claimants -> fan-out probe; failed hints evict). Pin to the
  # fixed engine.
  REBUCK2_REV_PIN: d3a031d9e4a39cce306a73d62c90d2d6f60cc9a4
  TOTAL_WORKERS: "11"
  # Quorum: discovery flakes strand individual workers; 8 of 11 lets the
  # sweep proceed (late joiners still connect - 30min window) while a whole
  # missing platform still stalls only its own leg's queue.
  QUORUM_WORKERS: "8"

jobs:
  driver:
    name: driver
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write # dice-snap pruning (cache DELETE)
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"

      - name: Install buck2
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-unknown-linux-musl.zst" | zstd -d > "$HOME/bin/buck2"
          chmod +x "$HOME/bin/buck2"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/buck2" --version

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=${REBUCK2_REV_PIN:-$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)}" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      # DICE ladder, hetero edition: the driver box is linux, so one linux
      # fork binary serves all three legs (target platforms differ; the
      # buck2 process does not). Fork binaries are release assets on
      # gilescope/buck2 (eviction-proof); fetch failure = release binary, no dice.
      - name: Fetch fork buck2 (dice persistence)
        id: forkbin
        run: |
          REL="https://github.com/gilescope/buck2/releases/download/dice-persistence"
          REV=$(curl -fsSL "$REL/manifest.txt" 2>/dev/null | head -1 || true)
          if [ -z "$REV" ]; then echo "no fork release manifest — release-mode sweep"; exit 0; fi
          mkdir -p fork-bin
          if curl -fsSL "$REL/buck2-linux-$REV.zst" | zstd -d > fork-bin/buck2; then
            chmod +x fork-bin/buck2
            echo "$REV" > fork-bin/REV
            echo "rev=$REV" >> "$GITHUB_OUTPUT"
            echo "fork binary $REV fetched"
          else
            echo "asset fetch failed — release-mode sweep"
            rm -rf fork-bin
          fi

      - name: Restore dice snapshots (all legs)
        if: steps.forkbin.outputs.rev != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dice-snap
          key: dice-snap-hetero-never-matches
          restore-keys: dice-snap-hetero-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**') }}-

      - name: Enable dice persistence (fork binary + matched prelude)
        if: steps.forkbin.outputs.rev != ''
        run: |
          cp fork-bin/buck2 "$HOME/bin/buck2"
          chmod +x "$HOME/bin/buck2"
          "$HOME/bin/buck2" --version
          echo "FORK_REV=$(cat fork-bin/REV 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"
          mkdir -p dice-snap
          REV=$(cat fork-bin/REV)
          git init --quiet "$RUNNER_TEMP/fork-src"
          git -C "$RUNNER_TEMP/fork-src" remote add origin https://github.com/gilescope/buck2
          git -C "$RUNNER_TEMP/fork-src" fetch --quiet --depth 1 --filter=blob:none origin "$REV"
          git -C "$RUNNER_TEMP/fork-src" sparse-checkout set prelude
          git -C "$RUNNER_TEMP/fork-src" checkout --quiet FETCH_HEAD
          rm -rf prelude
          cp -r "$RUNNER_TEMP/fork-src/prelude" prelude

      # Roadmap #9: the driver seeds only the ACTION CACHE. CAS shards
      # restore on the WORKERS (parallel, during the join window); bloom
      # gossip + HasMany verification makes them count in
      # FindMissingBlobs. Monolith restore stays as transition fallback.
      - name: Restore AC snapshot
        id: acsnap
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-ac
          key: rebuck2-ac2-${{ github.run_id }}
          restore-keys: rebuck2-ac2-

      - name: Restore hetero monolith (transition fallback)
        if: steps.acsnap.outputs.cache-matched-key == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-hetero
          key: rebuck2-store-hetero-${{ github.run_id }}
          restore-keys: rebuck2-store-hetero-

      - name: Seed the driver store
        run: |
          STORE="$HOME/.cache/rebuck2"
          mkdir -p "$STORE/driver"
          for t in snapshot-ac/ac.tar.zst snapshot-hetero/bulk.tar.zst snapshot-hetero/tail.tar.zst; do
            if [ -f "$t" ]; then
              zstd -d --long=27 < "$t" | tar -x -C "$STORE/driver"
              echo "seeded from $t ($(du -h "$t" | cut -f1))"
            fi
          done
          rm -rf snapshot-ac snapshot-hetero
          # AC-only manifest: unchanged AC at run end = skip pack + upload.
          ./ci/store-snapshot.sh manifest "$STORE/driver" ac > seeded.manifest
          echo "seeded AC manifest: $(cat seeded.manifest)"

      - name: Reclaim runner ballast in the background
        run: |
          (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
             /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null; df -h /) &

      - name: Start driver (barrier on the full mixed fleet)
        run: |
          STORE="$HOME/.cache/rebuck2"
          rebuck2 driver --grpc-port 9092 --min-workers "$QUORUM_WORKERS" --no-local-exec --cache-failures --locality \
            --session "hetero-$GITHUB_RUN_ID" \
            --addr-file driver-addr.json \
            --finalize-file finalize.signal \
            --store "$STORE/driver" > driver.log 2>&1 &
          echo $! > driver.pid
          rebuck2 worker --session "hetero-$GITHUB_RUN_ID" --slots $(($(nproc) / 2)) \
            --store "$STORE/co-worker" > co-worker.log 2>&1 &

      - name: Wait for driver addr
        run: |
          for _ in $(seq 1 60); do [ -s driver-addr.json ] && exit 0; sleep 2; done
          echo "driver never wrote its addr"; cat driver.log; exit 1

      # Workers fetch this and dial the relay directly - no n0 discovery
      # dependency (two runs died to a regional discovery outage).
      - name: Publish driver addr
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-addr
          path: driver-addr.json

      - name: Wait for worker quorum
        run: |
          # 45min: a rebuck2 rev bump makes every worker cold-compile the
          # binary (~10-15min on win/mac) before it can join.
          for _ in $(seq 1 540); do
            joined=$(grep -c " joined: " driver.log || true)
            [ "$joined" -ge "$QUORUM_WORKERS" ] && { grep " joined: " driver.log; exit 0; }
            kill -0 "$(cat driver.pid)" || { cat driver.log; echo "driver died"; exit 1; }
            sleep 5
          done
          cat driver.log; echo "quorum never formed"; exit 1

      - name: Point buck2 at rebuck2
        run: |
          cat > .buckconfig.local <<'EOF'
          [buck2_re_client]
          action_cache_address = grpc://127.0.0.1:9092
          cas_address = grpc://127.0.0.1:9092
          engine_address = grpc://127.0.0.1:9092
          tls = false
          EOF

      - name: Build all three legs concurrently
        env:
          SKIP_EXPECTED: "1"
        run: |
          leg() {
            local name="$1" plat="$2" tplat="$3" explat="$4"
            local dice=()
            if [ -n "${FORK_REV:-}" ]; then
              mkdir -p "dice-snap/$name"
              dice=(BUCK2_DICE_DB_PATH="$GITHUB_WORKSPACE/dice-snap/$name/db"
                    BUCK2_DICE_SNAPSHOT_PATH="$GITHUB_WORKSPACE/dice-snap/$name/graph.meta"
                    BUCK2_DICE_SNAPSHOT_SEED="$FORK_REV-$name-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**') }}")
            fi
            env "${dice[@]}" PLATFORM_OVERRIDE="$plat" BUCK2_ISOLATION="$name" \
            BUCK2_BUILD_ARGS="--target-platforms fixups//platforms:$tplat -c build.execution_platforms=fixups//platforms:$explat" \
              timeout 15000 ./build-all.sh //third-party: //third-party/conflict-rigs/... \
              > "leg-$name.log" 2>&1
            local rc=$?
            # 124 = the 250-min checkpoint cap: progress banks in teardown
            # (finalize + shard/AC saves), the next run continues from it.
            [ $rc -eq 124 ] && echo "leg $name hit the checkpoint cap (banked)"
            echo "leg $name exited rc=$rc"
            return $rc
          }
          touch leg-win.log leg-linux.log leg-mac.log
          tail -F leg-win.log leg-linux.log leg-mac.log &
          TAIL=$!
          leg win   Windows-x86_64 t-win   re-exec-win-remote & WIN=$!
          leg linux Linux-x86_64   t-linux re-exec-linux & LIN=$!
          leg mac   Darwin-arm64   t-mac   re-exec-mac   & MAC=$!
          rc=0
          wait $WIN || { echo "WIN LEG FAILED"; rc=1; }
          wait $LIN || { echo "LINUX LEG FAILED"; rc=1; }
          wait $MAC || { echo "MAC LEG FAILED"; rc=1; }
          kill $TAIL 2>/dev/null || true
          for l in win linux mac; do
            echo "=== leg $l tail ==="
            tail -30 "leg-$l.log"
          done
          exit $rc

      - name: Save dice snapshots (page-out per leg)
        if: always() && steps.forkbin.outputs.rev != ''
        run: |
          for name in win linux mac; do
            buck2 --isolation-dir "$name" debug hydration page-out || echo "page-out $name failed (non-fatal)"
          done
          du -sh dice-snap/* 2>/dev/null || true

      - name: Save dice snapshot cache
        if: always() && steps.forkbin.outputs.rev != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dice-snap
          key: dice-snap-hetero-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**') }}-${{ github.run_id }}

      - name: Prune superseded dice snapshots (1GB each; they evicted the CAS)
        if: always() && steps.forkbin.outputs.rev != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("dice-snap-hetero-")) | .key' 2>/dev/null |
            grep -v -- "-${GITHUB_RUN_ID}$" |
            while read -r k; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$k" > /dev/null \
                && echo "pruned $k" || true
            done
          true

      # Hand CAS persistence to the fleet: driver assigns shards, workers
      # sync + save them in their own teardown (parallel, off our path).
      - name: Finalize shards across the fleet
        if: always()
        run: |
          touch finalize.signal
          for _ in $(seq 1 40); do
            [ -f finalize.signal.done ] && { echo "finalized: $(cat finalize.signal.done) workers"; exit 0; }
            kill -0 "$(cat driver.pid)" 2>/dev/null || { echo "driver gone before finalize"; exit 0; }
            sleep 5
          done
          echo "finalize timed out (workers save what they synced)"

      - name: Pack AC snapshot
        id: acpack
        if: always()
        run: |
          STORE="$HOME/.cache/rebuck2"
          if ./ci/store-snapshot.sh unchanged "$STORE/driver" seeded.manifest ac; then
            echo "[snapshot] AC unchanged since seed — skipping pack + upload"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p snapshot-ac
          tar -c -C "$STORE/driver" ac | zstd -T0 --long=27 -8 > snapshot-ac/ac.tar.zst
          ls -lh snapshot-ac/

      - name: Save AC snapshot
        if: always() && steps.acpack.outputs.skip != '1'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-ac
          key: rebuck2-ac2-${{ github.run_id }}

      - name: Dispatch stats
        if: always()
        run: |
          kill -0 "$(cat driver.pid)" 2>/dev/null || echo "*** DRIVER PROCESS DIED — check driver.log tail below ***"
          echo "jobs dispatched: $(grep -c -- '-> worker ' driver.log || true)"
          grep -o -- '-> worker [0-9]*' driver.log | sort | uniq -c || true
          tail -5 driver.log

      - name: Collect buck2 event logs (per leg, download attribution)
        if: always()
        run: |
          mkdir -p evtlog
          # `log path` returns the LAST command - the dice page-out step
          # runs between build and collection, so that grabbed 2KB
          # hydration logs instead of the builds (healing5). Copy every
          # invocation's log from the isolation dir instead.
          for name in win linux mac; do
            EL=$(buck2 --isolation-dir "$name" log path 2>/dev/null | tail -1 || true)
            if [ -n "$EL" ] && [ -d "$(dirname "$EL")" ]; then
              for f in "$(dirname "$EL")"/*.pb.zst; do
                [ -f "$f" ] && cp "$f" "evtlog/$name-$(basename "$f")"
              done
            else
              echo "no event logs for leg $name"
            fi
          done
          ls -lh evtlog/ || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hetero-logs
          path: |
            driver.log
            leg-*.log
            evtlog/

      - name: Stop driver
        if: always()
        run: kill "$(cat driver.pid)" 2>/dev/null || true

    # A lost worker must not redden the run - the driver job is the
    # verdict, and the mesh tolerates stragglers.
  worker-win:
    name: win worker ${{ matrix.n }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - {n: 1, shard: 0}
          - {n: 2, shard: 1}
          - {n: 3, shard: 2}
          - {n: 4, shard: 3}
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=${REBUCK2_REV_PIN:-$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rebuck2bin
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}
      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2
      - name: Mount ReFS Dev Drive
        if: env.USE_DEV_DRIVE == '1'
        uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          drive-size: 24GB
          drive-format: ReFS
      # Roadmap #9: preload this worker's slice of the CAS during the join
      # window; bloom gossip announces it, the driver's HasMany verifies it.
      - name: Restore cas shard ${{ matrix.shard }} (newest artifact, any run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts, not the actions cache: the 10GB cache LRU evicted the
          # whole shard set within an hour (run 28932994472 died on it).
          # Public-repo artifacts don't evict and every run refreshes them.
          mkdir -p shard-in
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cas-shard-${{ matrix.shard }}&per_page=1" \
            --jq '[.artifacts[] | select(.expired==false and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty' 2>/dev/null || true)
          if [ -n "$AID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > shard.zip \
              && unzip -o -q shard.zip -d shard-in && rm -f shard.zip \
              && ls -lh shard-in/ || echo "shard artifact fetch failed - cold start"
          else
            echo "no cas-shard-${{ matrix.shard }} artifact yet - cold start"
          fi

      - name: Seed the worker store from the shard
        run: |
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          mkdir -p "$STORE/worker"
          for t in shard-in/bulk.tar.zst shard-in/tail.tar.zst; do
            if [ -f "$t" ]; then
              zstd -d --long=27 < "$t" | tar -x -C "$STORE/worker"
              echo "seeded from $t ($(du -h "$t" | cut -f1))"
            fi
          done
          rm -rf shard-in
          # Record the restored shard's manifest — if finalize assigns this
          # same shard back and nothing changed, the re-save is skipped.
          a=$(printf '%x' $(( ${{ matrix.shard }} * 2 ))); b=$(printf '%x' $(( ${{ matrix.shard }} * 2 + 1 )))
          ./ci/store-snapshot.sh manifest "$STORE/worker" "cas/$a* cas/$b*" > seeded.manifest
          echo "seeded shard manifest: $(cat seeded.manifest)"
          # Blobs that crossed the artifact wall must prove themselves:
          # a CAS filename IS the content sha256; mismatches are deleted.
          ./ci/verify-cas.sh "$STORE/worker"

      - name: Fetch driver addr (poll 40min — driver runner allocation can tail past 30; discovery remains the fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 240); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 --jq '.artifacts[] | select(.name=="driver-addr") | .id' 2>/dev/null | head -1 > aid.txt \
               && [ -s aid.txt ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(cat aid.txt)/zip" > addr.zip 2>/dev/null \
                && unzip -o addr.zip > /dev/null && [ -s driver-addr.json ] && break
            fi
            sleep 10
          done
          ls -la driver-addr.json 2>/dev/null || echo "no addr artifact - falling back to discovery"

      - name: Serve until the driver disconnects
        run: |
          ADDR_FLAG=()
          [ -s driver-addr.json ] && ADDR_FLAG=(--driver-addr-file driver-addr.json)
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          # Canonical exec dirs (engine 61f9189+) on the same volume as the
          # store, or keyed materializations cross devices (copy, not link).
          if [ -n "${DEV_DRIVE:-}" ]; then
            REBUCK2_EXEC_BASE="$(cygpath -w "$(cygpath -u "$DEV_DRIVE")/rb2x")"
            export REBUCK2_EXEC_BASE
          fi
          timeout 18000 rebuck2 worker \
            --session "hetero-$GITHUB_RUN_ID" \
            "${ADDR_FLAG[@]}" \
            --preloaded-shard "${{ matrix.shard }}" \
            --connect-wait-secs 1800 \
            --store "$STORE/worker" | tee worker.log

      - name: Read assigned shard
        id: sid
        if: always()
        run: |
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          # shard.id has no trailing newline: read returns rc=1 at EOF even
          # after assigning - under bash -e that killed this step on EVERY
          # worker, so shards were never published (not evicted: never saved).
          shard=""; of=""
          [ -f "$STORE/worker/shard.id" ] && { read -r shard of < "$STORE/worker/shard.id" || true; }
          if [ -n "$shard" ]; then
            echo "shard=$shard" >> "$GITHUB_OUTPUT"
            echo "assigned shard $shard of $of"
          else
            echo "no shard assigned (driver died pre-finalize?)"
          fi

      - name: Pack + save assigned shard
        id: shardpack
        if: always() && steps.sid.outputs.shard != ''
        run: |
