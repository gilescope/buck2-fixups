          toolchain: "1.92.0"
      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=${REBUCK2_REV_PIN:-$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rebuck2bin
        with:
          path: ~/.cargo/bin/rebuck2
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}
      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        # Codeload tarball, not a git clone: a pin bump makes every runner
        # install at once, and 13 simultaneous git-protocol clones of one
        # small repo hit spurious EOFs fleet-wide (run 29279904483). The
        # tarball path is plain HTTPS with honest curl retries.
        run: |
          curl -fsSL --retry 8 --retry-all-errors             "${REBUCK2_GIT/github.com/codeload.github.com}/tar.gz/$REBUCK2_REV" | tar xz
          cargo install --locked --path "rebuck-$REBUCK2_REV/rebuck2"
          rm -rf "rebuck-$REBUCK2_REV"
      # Roadmap #9 v2: preload this worker's prefix range from the CAS
      # bank (ci/cas-bank-design.md); bloom gossip announces it, the
      # driver's HasMany verifies it. Exit 3 = cold bank -> bootstrap
      # from the legacy monolithic shard artifact below.
      - name: Restore CAS bank (own range + spill absorption)
        id: bank
        env:
          GH_TOKEN: ${{ github.token }}
          ABSORB_SPILLS: ${{ matrix.owns != '-' && '1' || '' }}
        run: |
          # BANK_WORK outside the repo root: stray files in the
          # workspace churn buck2's file watcher.
          export BANK_WORK="$RUNNER_TEMP/bank"
          STORE="$HOME/.cache/rebuck2"
          rc=0; ./ci/cas-bank-restore.sh "$STORE/worker" "${{ matrix.shard }}" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "cold=1" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Seed from legacy shard (cold-bank bootstrap)
        if: steps.bank.outputs.cold == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts, not the actions cache: the 10GB cache LRU evicted the
          # whole shard set within an hour (run 28932994472 died on it).
          # Public-repo artifacts don't evict and every run refreshes them.
          mkdir -p shard-in
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cas-shard-${{ matrix.shard }}&per_page=1" \
            --jq '[.artifacts[] | select(.expired==false and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty' 2>/dev/null || true)
          if [ -n "$AID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > shard.zip \
              && unzip -o -q shard.zip -d shard-in && rm -f shard.zip \
              && ls -lh shard-in/ || echo "shard artifact fetch failed - cold start"
          else
            echo "no cas-shard-${{ matrix.shard }} artifact yet - cold start"
          fi
          STORE="$HOME/.cache/rebuck2"
          mkdir -p "$STORE/worker"
          for t in shard-in/bulk.tar.zst shard-in/tail.tar.zst; do
            if [ -f "$t" ]; then
              zstd -d --long=27 < "$t" | tar -x -C "$STORE/worker"
              echo "seeded from $t ($(du -h "$t" | cut -f1))"
            fi
          done
          rm -rf shard-in

      - name: Verify seeded blobs
        run: |
          STORE="$HOME/.cache/rebuck2"
          mkdir -p "$STORE/worker"
          # Blobs that crossed the artifact wall must prove themselves:
          # a CAS filename IS the content sha256; mismatches are deleted.
          ./ci/verify-cas.sh "$STORE/worker"

      - name: Fetch driver addr (poll 40min — driver runner allocation can tail past 30; discovery remains the fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 240); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 --jq '.artifacts[] | select(.name=="driver-addr") | .id' 2>/dev/null | head -1 > aid.txt \
               && [ -s aid.txt ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(cat aid.txt)/zip" > addr.zip 2>/dev/null \
                && unzip -o addr.zip > /dev/null && [ -s driver-addr.json ] && break
            fi
            sleep 10
          done
          ls -la driver-addr.json 2>/dev/null || echo "no addr artifact - falling back to discovery"

      - name: Serve until the driver disconnects
        run: |
          ADDR_FLAG=()
          [ -s driver-addr.json ] && ADDR_FLAG=(--driver-addr-file driver-addr.json)
          STORE="$HOME/.cache/rebuck2"
          if command -v timeout >/dev/null 2>&1; then T=(timeout 18000)
          elif command -v gtimeout >/dev/null 2>&1; then T=(gtimeout 18000)
          else T=(); fi
          "${T[@]}" rebuck2 worker \
            --session "hetero-$GITHUB_RUN_ID" \
            "${ADDR_FLAG[@]}" \
            --preloaded-shard "${{ matrix.shard }}" \
            --connect-wait-secs 1800 \
            --store "$STORE/worker" | tee worker.log

      # Bank pack: exact diff against the union blob list. Own-range
      # new blobs become segments + a staged range manifest; the rest
      # spills for its owners. Self-verification is step ORDER: the
      # manifest only uploads after the container it references landed.
      - name: Pack new blobs for the bank
        id: bankpack
        if: always()
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          STORE="$HOME/.cache/rebuck2"
          ./ci/cas-bank-publish.sh "$STORE/worker" "${{ runner.os }}-w${{ matrix.n }}" "${{ matrix.owns }}"

      - name: Upload bank container
        id: upcontainer
        if: always() && steps.bankpack.outputs.have == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-segs-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-${{ runner.os }}-w${{ matrix.n }}
          path: ${{ runner.temp }}/bank/bank-container
          compression-level: 0

      # Atomic + self-verified: this range manifest references ONLY the
      # container above, and only uploads once that step succeeded. A
      # death anywhere earlier leaves the previous generation as HEAD.
      - name: Publish range manifest
        if: always() && steps.bankpack.outputs.manifest == '1' && steps.upcontainer.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-manifest-${{ env.CAS_LINEAGE }}-r${{ matrix.owns }}
          path: ${{ runner.temp }}/bank/bank-manifest-out

      - name: Upload bank spill
        if: always() && steps.bankpack.outputs.spill == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-spill-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-${{ runner.os }}-w${{ matrix.n }}
          path: ${{ runner.temp }}/bank/bank-spill
          compression-level: 0
