          mkdir -p "$STORE/worker"
          # Blobs that crossed the artifact wall must prove themselves:
          # a CAS filename IS the content sha256; mismatches are deleted.
          ./ci/verify-cas.sh "$STORE/worker"

      - name: Fetch driver addr (poll 40min — driver runner allocation can tail past 30; discovery remains the fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 240); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 --jq '.artifacts[] | select(.name=="driver-addr") | .id' 2>/dev/null | head -1 > aid.txt \
               && [ -s aid.txt ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$(cat aid.txt)/zip" > addr.zip 2>/dev/null \
                && unzip -o addr.zip > /dev/null && [ -s driver-addr.json ] && break
            fi
            sleep 10
          done
          ls -la driver-addr.json 2>/dev/null || echo "no addr artifact - falling back to discovery"

      - name: Serve until the driver disconnects
        run: |
          ADDR_FLAG=()
          [ -s driver-addr.json ] && ADDR_FLAG=(--driver-addr-file driver-addr.json)
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          # Canonical exec dirs (engine 61f9189+) on the same volume as the
          # store, or keyed materializations cross devices (copy, not link).
          if [ -n "${DEV_DRIVE:-}" ]; then
            REBUCK2_EXEC_BASE="$(cygpath -w "$(cygpath -u "$DEV_DRIVE")/rb2x")"
            export REBUCK2_EXEC_BASE
          fi
          timeout 18000 rebuck2 worker \
            --session "hetero-$GITHUB_RUN_ID" \
            "${ADDR_FLAG[@]}" \
            --preloaded-shard "${{ matrix.shard }}" \
            --connect-wait-secs 1800 \
            --store "$STORE/worker" | tee worker.log

      # Bank pack: exact diff against the union blob list. Own-range
      # new blobs become segments + a staged range manifest; the rest
      # spills for its owners. Self-verification is step ORDER: the
      # manifest only uploads after the container it references landed.
      - name: Pack new blobs for the bank
        id: bankpack
        if: always()
        run: |
          BANK_WORK="$(cygpath -u "$RUNNER_TEMP")/bank"; export BANK_WORK
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          ./ci/cas-bank-publish.sh "$STORE/worker" "${{ runner.os }}-w${{ matrix.n }}" "${{ matrix.owns }}"

      - name: Upload bank container
        id: upcontainer
        if: always() && steps.bankpack.outputs.have == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-segs-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-${{ runner.os }}-w${{ matrix.n }}
          path: ${{ runner.temp }}/bank/bank-container
          compression-level: 0

      # Atomic + self-verified: this range manifest references ONLY the
      # container above, and only uploads once that step succeeded. A
      # death anywhere earlier leaves the previous generation as HEAD.
      - name: Publish range manifest
        if: always() && steps.bankpack.outputs.manifest == '1' && steps.upcontainer.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-manifest-${{ env.CAS_LINEAGE }}-r${{ matrix.owns }}
          path: ${{ runner.temp }}/bank/bank-manifest-out

      - name: Upload bank spill
        if: always() && steps.bankpack.outputs.spill == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-spill-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-${{ runner.os }}-w${{ matrix.n }}
          path: ${{ runner.temp }}/bank/bank-spill
          compression-level: 0


