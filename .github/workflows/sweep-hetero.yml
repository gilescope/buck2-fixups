# Stabilize lap: primary-only finalize + 180s (reverted redundant/dup-artifact mess). All 8 shards present; aiming for a clean 8/8 bank.
# Heterogeneous sweep: ONE rebuck2 driver + a mixed win/linux/mac fleet.
# WARM READER on the first clean-era pool (banked by 29089941213,
# 68m52s: quorum 50s / legs 64m33s / finalize 2m05s).
# Lap N+1: parallel verify-cas (the 31-min windows sequential hash was
# the join race behind BOTH the 23k-unservable class and the 31-min
# win-leg stall) + engine 835401b-era (memo + sync-24).
# Scope: full //third-party: (2,185 crates) + conflict rigs + snapshot
# rigs re-entering one per lap (2024-11 in; 2025-05/2025-11/2026-05
# pending). ~53-73% of each rig's crate versions are content-identical
# with base, so the CAS serves their sources; compiles are per-rig work.
# The driver box runs three concurrent buck2 invocations (one per target OS,
# separate isolation dirs) against the same localhost driver; rebuck2 routes
# each action to a worker whose OS/arch matches the exec platform's REAPI
# properties. One store, one action cache, one mesh.
#
# v1 caveat: local_only toolchain discovery (vswhere-class) runs beside the
# driver, so it is native only for the windows leg - the driver is windows.
# linux/mac cxx-discovery failures land in those legs' expected lists.
# Snapshot rigs stay excluded (base + conflict rigs only).
# roadmap #9: fleet-sharded snapshots — workers restore + save CAS shards;
# the driver owns only the AC and dice. Finalize handoff post-build.
# take 4: cross legs pure-remote - hybrid ran linux compiles on the win box.
# goal run: healing 3 - full engine (validated AC, read-through, affinity,
# parallel probes, canonical materialization). Heals writer5 seeds then the
# next run is the measured reader.
# - unservable results re-execute and self-heal the artifact-hosted shards.
# size_bytes deferral, AC-only driver seed. The reader after this one is the
# measured hetero time.
name: sweep-hetero
on:
  workflow_dispatch: {}
  push:
    branches: [giles-rebuck2-sweep]
    paths:
      - .github/workflows/sweep-hetero.yml

permissions:
  contents: read

concurrency:
  group: sweep-hetero
  cancel-in-progress: false

env:
  BUCK2_VERSION: 2026-06-01
  USE_DEV_DRIVE: "1"
  REBUCK2_GIT: https://github.com/gilescope/rebuck
  REBUCK2_BRANCH: giles-iroh-re-punch
  # Concurrent output-tree ingestion (4c402ee: the 78-254s http_archive
  # mega-unpack tails on every leg's critical path) + worker liveness
  # watchdog / driver exit broadcast (6c676dc: win worker 1 idled 1h+
  # past the driver, run 29194749613). Prior lap 29195973667: build
  # 8m44s, win staging p90 18.7s -> 3s, second straight 8/8 bank.
  # 7fda4e8: exec-bit guarantee on Linked materialization (bank-seeded
  # build scripts staged 0o100644, EACCES) + canonical hits carry
  # execution_metadata (buck2's client hard-rejects bare ActionResults;
  # every name-independent hit was an internal error).
  REBUCK2_REV_PIN: f96bf5dc7d2d80ba07d8059ce017a2bd16ebdd0b
  TOTAL_WORKERS: "11"
  # Quorum: discovery flakes strand individual workers; 8 of 11 lets the
  # sweep proceed (late joiners still connect - 30min window) while a whole
  # missing platform still stalls only its own leg's queue.
  QUORUM_WORKERS: "8"
  # CAS bank (ci/cas-bank-design.md): lineage = the branch. Artifact
  # names embed it, and restore's provenance check requires the
  # publishing run's head_branch to equal it.
  CAS_LINEAGE: ${{ github.ref_name }}
  SEG_MAX_MB: "64"
  # par: all three legs concurrently (~longest-leg wall time). seq -
  # one leg at a time with a daemon page-out+restart between legs -
  # bounds peak memory to one leg and is the right setting for a COLD
  # fleet (three cold parallel legs put the daemon at 10GiB and the
  # 16GB box died by thrash, run 29499874526). Warm laps are cache
  # replay and fit easily; the watchdog/choom/swap net catches a
  # surprise cold lap by checkpointing it (banks, next lap continues).
  LEG_MODE: "par"

jobs:
  driver:
    name: driver
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write # dice-snap pruning (cache DELETE)
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"

      - name: Install buck2
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-unknown-linux-musl.zst" | zstd -d > "$HOME/bin/buck2"
          chmod +x "$HOME/bin/buck2"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/buck2" --version

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=${REBUCK2_REV_PIN:-$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)}" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        # Codeload tarball, not a git clone: a pin bump makes every runner
        # install at once, and 13 simultaneous git-protocol clones of one
        # small repo hit spurious EOFs fleet-wide (run 29279904483). The
        # tarball path is plain HTTPS with honest curl retries.
        run: |
          curl -fsSL --retry 8 --retry-all-errors             "${REBUCK2_GIT/github.com/codeload.github.com}/tar.gz/$REBUCK2_REV" | tar xz
          cargo install --locked --path "rebuck-$REBUCK2_REV/rebuck2"
          rm -rf "rebuck-$REBUCK2_REV"

      # DICE ladder, hetero edition: the driver box is linux, so one linux
      # fork binary serves all three legs (target platforms differ; the
      # buck2 process does not). Fork binaries are release assets on
      # gilescope/buck2 (eviction-proof); fetch failure = release binary, no dice.
      - name: Fetch fork buck2 (dice persistence)
        id: forkbin
        run: |
          REL="https://github.com/gilescope/buck2/releases/download/dice-persistence"
          REV=$(curl -fsSL "$REL/manifest.txt" 2>/dev/null | head -1 || true)
          if [ -z "$REV" ]; then echo "no fork release manifest — release-mode sweep"; exit 0; fi
          mkdir -p fork-bin
          if curl -fsSL "$REL/buck2-linux-$REV.zst" | zstd -d > fork-bin/buck2; then
            chmod +x fork-bin/buck2
            echo "$REV" > fork-bin/REV
            echo "rev=$REV" >> "$GITHUB_OUTPUT"
            echo "fork binary $REV fetched"
          else
            echo "asset fetch failed — release-mode sweep"
            rm -rf fork-bin
          fi

      # Dice bank: append-only row segments + a manifest carrying the
      # graph skeleton whole (19MB; the 4GB is the sqlite value shards,
      # content-addressed and INSERT OR IGNORE-mergeable). Replaces the
      # 1.1GB monolithic cache save; the cache step below remains as
      # the cold-bank bootstrap fallback.
      - name: Restore dice bank
        id: dicebank
        if: steps.forkbin.outputs.rev != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DICE_SEED: ${{ steps.forkbin.outputs.rev }}-sweep-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**', 'toolchains/**', 'ci/prelude-unpack-dedupe.patch') }}
        run: |
          echo "seed8=$(printf '%s' "$DICE_SEED" | sha256sum | cut -c1-8)"             >> "$GITHUB_OUTPUT"
          export BANK_WORK="$RUNNER_TEMP/bank"
          rc=0; ./ci/dice-bank-restore.sh dice-snap/sweep || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "cold=1" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Restore dice snapshots (cold-bank bootstrap fallback)
        if: steps.forkbin.outputs.rev != '' && steps.dicebank.outputs.cold == '1'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dice-snap
          key: dice-snap-hetero-never-matches
          restore-keys: dice-snap-hetero-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**', 'toolchains/**', 'ci/prelude-unpack-dedupe.patch') }}-

      - name: Enable dice persistence (fork binary + matched prelude)
        if: steps.forkbin.outputs.rev != ''
        run: |
          cp fork-bin/buck2 "$HOME/bin/buck2"
          chmod +x "$HOME/bin/buck2"
          "$HOME/bin/buck2" --version
          echo "FORK_REV=$(cat fork-bin/REV 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"
          mkdir -p dice-snap
          REV=$(cat fork-bin/REV)
          git init --quiet "$RUNNER_TEMP/fork-src"
          git -C "$RUNNER_TEMP/fork-src" remote add origin https://github.com/gilescope/buck2
          git -C "$RUNNER_TEMP/fork-src" fetch --quiet --depth 1 --filter=blob:none origin "$REV"
          git -C "$RUNNER_TEMP/fork-src" sparse-checkout set prelude
          git -C "$RUNNER_TEMP/fork-src" checkout --quiet FETCH_HEAD
          rm -rf prelude
          cp -r "$RUNNER_TEMP/fork-src/prelude" prelude
          # The fork prelude just REPLACED the vendored one, discarding
          # repo-local prelude changes. Re-apply them; fail loudly rather
          # than silently building without (run 29198759978 no-op'd the
          # unpack dedupe exactly this way).
          git apply --verbose ci/prelude-unpack-dedupe.patch

      # Roadmap #9: the driver seeds only the ACTION CACHE. CAS shards
      # restore on the WORKERS (parallel, during the join window); bloom
      # gossip + HasMany verification makes them count in
      # FindMissingBlobs. Monolith restore stays as transition fallback.
      - name: Restore AC snapshot
        id: acsnap
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-ac
          key: rebuck2-ac2-${{ github.run_id }}
          restore-keys: rebuck2-ac2-

      - name: Restore hetero monolith (transition fallback)
        if: steps.acsnap.outputs.cache-matched-key == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-hetero
          key: rebuck2-store-hetero-${{ github.run_id }}
          restore-keys: rebuck2-store-hetero-

      # Driver hot-CAS: the small pipelining metadata (rmetas, dirs
      # argsfiles) the driver relayed to buck2 clients last lap. Seeding
      # it locally turns client downloads from 84 KiB/s cross-mesh relays
      # into local-disk reads - the client-download bottleneck.
      - name: Restore driver hot-CAS
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-hotcas
          key: rebuck2-hotcas-${{ github.run_id }}
          restore-keys: rebuck2-hotcas-

      - name: Seed the driver store
        run: |
          STORE="$HOME/.cache/rebuck2"
          mkdir -p "$STORE/driver"
          for t in snapshot-ac/ac.tar.zst snapshot-hotcas/hotcas.tar.zst snapshot-hetero/bulk.tar.zst snapshot-hetero/tail.tar.zst; do
            if [ -f "$t" ]; then
              # Corrupt snapshot (a failed lap's always()-pack banked a
              # truncated file) = cold start for that piece, never job
              # death: run 29280964336 died seeding a 312-BYTE ac.tar.zst.
              if zstd -d --long=27 < "$t" | tar -x -C "$STORE/driver"; then
                echo "seeded from $t ($(du -h "$t" | cut -f1))"
              else
                echo "WARNING: corrupt snapshot $t - skipping (cold start)"
              fi
            fi
          done
          rm -rf snapshot-ac snapshot-hotcas snapshot-hetero
          # --cache-failures writes failure rows; the read path serves
          # them unconditionally (rebuck2 rpc.rs), so a banked
          # environmental failure (exec-bit EACCES, lap 29522220924)
          # replays forever. Purge failures at seed: in-lap failure
          # caching keeps working, poison stops crossing laps.
          for d in "$STORE/driver/ac" "$STORE/driver/acn"; do
            [ -d "$d" ] && ./ci/cas-bank.sh _tool ac-purge-failures "$d"
          done
          # AC-only manifest: unchanged AC at run end = skip pack + upload.
          ./ci/store-snapshot.sh manifest "$STORE/driver" "ac acn" > seeded.manifest
          echo "seeded AC manifest: $(cat seeded.manifest)"

      # Blob-list-only bank restore ('-' = no shard, no seeding): leaves
      # the union blob list in $BANK_WORK so the post-build spill packs
      # diff store-minus-bank exactly. Exit 3 = cold bank (the pack then
      # diffs against /dev/null and spills everything - bootstrap).
      - name: Fetch bank blob list (no seeding)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          rc=0; ./ci/cas-bank-restore.sh "$(mktemp -d)" "-" || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || exit "$rc"

      - name: Reclaim runner ballast in the background
        run: |
          (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
             /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null; df -h /) &

      # Frozen analysis heaps are write-once-read-rarely - ideal swap
      # candidates. 16GB on the /mnt SSD lets earlier legs' cold heaps
      # spill while the live leg's transients keep the RAM (images ship
      # only 4GB swap).
      - name: Add swap on /mnt
        run: |
          sudo fallocate -l 16G /mnt/swapfile2
          sudo chmod 600 /mnt/swapfile2
          sudo mkswap -q /mnt/swapfile2
          sudo swapon /mnt/swapfile2
          sudo sysctl -q vm.swappiness=80
          swapon --show
          free -h

      - name: Start driver (barrier on the full mixed fleet)
        run: |
          STORE="$HOME/.cache/rebuck2"
          rebuck2 driver --grpc-port 9092 --min-workers "$QUORUM_WORKERS" --require-shards 8 --no-local-exec --cache-failures --locality \
            --session "hetero-$GITHUB_RUN_ID" \
            --addr-file driver-addr.json \
            --store "$STORE/driver" > driver.log 2>&1 &
          echo $! > driver.pid
          rebuck2 worker --session "hetero-$GITHUB_RUN_ID" --slots $(($(nproc) / 2)) \
            --store "$STORE/co-worker" > co-worker.log 2>&1 &

      - name: Wait for driver addr
        run: |
          for _ in $(seq 1 60); do [ -s driver-addr.json ] && exit 0; sleep 2; done
          echo "driver never wrote its addr"; cat driver.log; exit 1

      # Workers fetch this and dial the relay directly - no n0 discovery
      # dependency (two runs died to a regional discovery outage).
      - name: Publish driver addr
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-addr
          path: driver-addr.json

      - name: Wait for worker quorum
        run: |
          # 45min: a rebuck2 rev bump makes every worker cold-compile the
          # binary (~10-15min on win/mac) before it can join.
          for _ in $(seq 1 540); do
            joined=$(grep -c " joined: " driver.log || true)
            [ "$joined" -ge "$QUORUM_WORKERS" ] && { grep " joined: " driver.log; exit 0; }
            kill -0 "$(cat driver.pid)" || { cat driver.log; echo "driver died"; exit 1; }
            sleep 5
          done
          cat driver.log; echo "quorum never formed"; exit 1

      - name: Point buck2 at rebuck2
        run: |
          cat > .buckconfig.local <<'EOF'
          [buck2_re_client]
          action_cache_address = grpc://127.0.0.1:9092
          cas_address = grpc://127.0.0.1:9092
          engine_address = grpc://127.0.0.1:9092
          tls = false
          EOF

      - name: Build all three legs concurrently
        env:
          SKIP_EXPECTED: "1"
        run: |
          # SINGLE DAEMON: one isolation dir + one exec-platform
          # registration (hetero-all) for all three legs. Routing comes
          # from per-target exec-compatibility (toolchain anchors +
          # archive unpack pin), not per-invocation registration. One
          # buck-out means the legs share unpack action digests - the
          # completion of the cross-leg dedupe (the per-leg isolation
          # prefix split them; run 29200907975).
          leg() {
            local name="$1" plat="$2" tplat="$3" explat="$4"
            local dice=()
            if [ -n "${FORK_REV:-}" ]; then
              mkdir -p "dice-snap/sweep"
              dice=(BUCK2_DICE_DB_PATH="$GITHUB_WORKSPACE/dice-snap/sweep/db"
                    BUCK2_DICE_SNAPSHOT_PATH="$GITHUB_WORKSPACE/dice-snap/sweep/graph.meta"
                    BUCK2_DICE_SNAPSHOT_SEED="$FORK_REV-sweep-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**', 'toolchains/**', 'ci/prelude-unpack-dedupe.patch') }}")
            fi
            # choom: if the OOM killer fires despite the watchdog, it
            # must pick the build (daemon inherits the score from its
            # first client), never the runner agent - a dead agent
            # skips every remaining step, always() included.
            env "${dice[@]}" PLATFORM_OVERRIDE="$plat" BUCK2_ISOLATION="sweep" \
            BUCK2_BUILD_ARGS="--target-platforms fixups//platforms:$tplat -c build.execution_platforms=fixups//platforms:$explat -c buck2.archive_unpack_constraints=fixups//platforms:unpack-exec-linux" \
              choom -n 900 -- timeout 15000 ./build-all.sh //third-party: //third-party/conflict-rigs/... //third-party/snapshots/2024-11/... \
              > "leg-$name.log" 2>&1
            local rc=$?
            # 124 = the 250-min checkpoint cap; 143 = the memory
            # watchdog. Either way progress banks in teardown and the
            # next run continues from it.
            { [ $rc -eq 124 ] || [ $rc -eq 143 ]; } \
              && echo "leg $name checkpointed rc=$rc (banks in teardown)"
            echo "leg $name exited rc=$rc"
            return $rc
          }
          touch leg-win.log leg-linux.log leg-mac.log
          tail -F leg-win.log leg-linux.log leg-mac.log &
          TAIL=$!
          # Memory watchdog: checkpoint BEFORE the VM dies. Kills the
          # clients then the DAEMON (the daemon holds the RSS and
          # outlives its clients); the step then exits normally and the
          # always() teardown banks AC/dice progress. An OOM'd/thrashed
          # runner skips teardown entirely - the AC stayed pinned at
          # run 29398083498 for a full day of laps exactly that way.
          (
            while sleep 10; do
              avail=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
              # PSI catches swap-thrash that MemAvailable never shows
              # (run 29499874526 died with "available" memory): full
              # avg10 > 20 means the box is stalling on memory.
              psi=$(awk -F'avg10=' '/full/ {print int($2)}' /proc/pressure/memory)
              if [ "$avail" -lt 2500 ] || [ "${psi:-0}" -gt 20 ]; then
                echo "[watchdog] MemAvailable=${avail}MB psi_full10=${psi:-0} - checkpointing"
                pkill -f build-all.sh 2>/dev/null || true
                sleep 5
                buck2 --isolation-dir sweep kill 2>/dev/null \
                  || pkill -f buck2d 2>/dev/null || true
                break
              fi
            done
          ) &
          WATCHDOG=$!
          # Page-out + daemon restart: drops the accumulated analysis
          # RSS to zero between legs; the next leg reloads the graph
          # from the dice snapshot (the persistence feature's day job).
          checkpoint_daemon() {
            buck2 --isolation-dir sweep debug hydration page-out \
              2>/dev/null || echo "[seq] page-out failed (non-fatal)"
            buck2 --isolation-dir sweep kill 2>/dev/null || true
          }
          rc=0
          if [ "$LEG_MODE" = "par" ]; then
            leg win   Windows-x86_64 t-win   hetero-all & WIN=$!
            leg linux Linux-x86_64   t-linux hetero-all & LIN=$!
            leg mac   Darwin-arm64   t-mac   hetero-all   & MAC=$!
            wait $WIN || { echo "WIN LEG ENDED rc=$?"; rc=1; }
            wait $LIN || { echo "LINUX LEG ENDED rc=$?"; rc=1; }
            wait $MAC || { echo "MAC LEG ENDED rc=$?"; rc=1; }
          else
            leg win   Windows-x86_64 t-win   hetero-all \
              || { echo "WIN LEG ENDED rc=$?"; rc=1; }
            checkpoint_daemon
            leg linux Linux-x86_64  t-linux hetero-all \
              || { echo "LINUX LEG ENDED rc=$?"; rc=1; }
            checkpoint_daemon
            leg mac   Darwin-arm64  t-mac   hetero-all \
              || { echo "MAC LEG ENDED rc=$?"; rc=1; }
          fi
          kill $WATCHDOG $TAIL 2>/dev/null || true
          for l in win linux mac; do
            echo "=== leg $l tail ==="
            tail -30 "leg-$l.log"
          done
          exit $rc

      - name: Save dice snapshots (page-out per leg)
        if: always() && steps.forkbin.outputs.rev != ''
        run: |
          buck2 --isolation-dir sweep debug hydration page-out || echo "page-out failed (non-fatal)"
          # Split matters for delta-banking dice: the sqlite value
          # shards dominate; graph.meta is the small byte-stable part.
          du -sh dice-snap/sweep/* 2>/dev/null || true
          du -sh dice-snap/* 2>/dev/null || true

      # Dice delta -> bank (replaces the 1.1GB cache save + prune; a
      # barely-changed graph now costs tens of MB). Self-verified by
      # step order: manifest only uploads after its container landed.
      - name: Publish dice bank (delta)
        id: diceout
        if: always() && steps.forkbin.outputs.rev != ''
        env:
          DICE_SEED: ${{ steps.forkbin.outputs.rev }}-sweep-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**', 'toolchains/**', 'ci/prelude-unpack-dedupe.patch') }}
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          ./ci/dice-bank-publish.sh dice-snap/sweep

      - name: Upload dice container
        id: updice
        if: always() && steps.diceout.outputs.have == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-dice-segs-${{ env.CAS_LINEAGE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bank/dice-container
          compression-level: 0

      - name: Publish dice manifest
        if: always() && steps.diceout.outputs.have == '1' && steps.updice.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-manifest-${{ env.CAS_LINEAGE }}-dice-${{ steps.dicebank.outputs.seed8 }}
          path: ${{ runner.temp }}/bank/dice-manifest-out

      # Banking no longer rides the mesh: each range owner publishes
      # its own manifest, self-verified by step order. Stopping the
      # driver here broadcasts exit to the fleet, so workers start
      # their own pack steps in parallel with ours.
      - name: Stop driver (fleet packs in its own teardown)
        if: always()
        run: |
          kill "$(cat driver.pid)" 2>/dev/null || true
          for _ in $(seq 1 24); do
            pgrep -f "rebuck2 worker" > /dev/null 2>&1 || { echo "co-worker exited"; break; }
            sleep 5
          done

      - name: Pack AC snapshot
        id: acpack
        if: always()
        run: |
          STORE="$HOME/.cache/rebuck2"
          # always() exists to bank checkpoint-capped laps - but a lap that
          # died before SEEDING has nothing to bank, and packing its empty
          # store published 300-byte snapshots that shadowed the good ones
          # via restore-keys (poisoned four laps' successors).
          if [ ! -f seeded.manifest ]; then
            echo "[snapshot] store was never seeded - nothing to bank"
            exit 0
          fi
          if ./ci/store-snapshot.sh unchanged "$STORE/driver" seeded.manifest "ac acn"; then
            echo "[snapshot] AC unchanged since seed — skipping pack + upload"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p snapshot-ac
          # acn/ = the canonical (name-independent) action cache: without
          # banking it, every lap's canon rows die with the runner and
          # cross-lap twins can never hit (2,902 rows lost, run 29281833627).
          mkdir -p "$STORE/driver/acn"
          # The driver is stopped before this pack, but keep the tar
          # tolerance: a straggler flush can still land mid-walk, GNU tar
          # exits 1 on ANY concurrent dir change, and pipefail once killed
          # the step AFTER zstd wrote a truncated snapshot that then got
          # banked (run 29288045948). Exit 1 = benign here; >=2 is real.
          tar --warning=no-file-changed --warning=no-file-removed             -c -C "$STORE/driver" ac acn | zstd -T0 --long=27 -8 > snapshot-ac/ac.tar.zst
          rc=${PIPESTATUS[0]}
          [ "$rc" -le 1 ] || exit "$rc"
          ls -lh snapshot-ac/

      - name: Save AC snapshot
        if: always() && steps.acpack.outputs.skip != '1'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-ac
          key: rebuck2-ac2-${{ github.run_id }}

      # Bank the driver's accumulated hot metadata (CAS blobs <= 256KB:
      # rmetas + dirs argsfiles, never the MB-scale rlibs which live on
      # worker shards). ~70MB, compresses tiny.
      - name: Pack driver hot-CAS
        id: hotpack
        if: always()
        run: |
          STORE="$HOME/.cache/rebuck2"
          if [ ! -d "$STORE/driver/cas" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p snapshot-hotcas
          # -4, no --long: this pack ran 435s at -8/--long=27 every lap
          # (run 29564589011) for a marginal ratio gain on tiny rmetas;
          # the seed side's -d --long=27 reads both formats fine.
          ( cd "$STORE/driver" && find cas -type f -size -262144c -print0 \
            | tar --null -c -T - ) | zstd -T0 -4 > snapshot-hotcas/hotcas.tar.zst
          ls -lh snapshot-hotcas/ || true

      - name: Save driver hot-CAS
        if: always() && steps.hotpack.outputs.skip != '1'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot-hotcas
          key: rebuck2-hotcas-${{ github.run_id }}

      # The driver box owns no range: everything new it holds spills,
      # and range owners absorb it on a later lap's restore.
      - name: Pack spill for the bank (driver)
        id: bankdriver
        if: always()
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          STORE="$HOME/.cache/rebuck2"
          ./ci/cas-bank-publish.sh "$STORE/driver" driver "-"

      - name: Upload bank spill (driver)
        if: always() && steps.bankdriver.outputs.spill == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-spill-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-driver
          path: ${{ runner.temp }}/bank/bank-spill
          compression-level: 0

      # Sequenced after the driver-role upload: publish reuses the same
      # $BANK_WORK staging dirs and wipes them on entry.
      - name: Pack spill for the bank (co-worker)
        id: bankcoworker
        if: always()
        run: |
          export BANK_WORK="$RUNNER_TEMP/bank"
          STORE="$HOME/.cache/rebuck2"
          ./ci/cas-bank-publish.sh "$STORE/co-worker" co-worker "-"

      - name: Upload bank spill (co-worker)
        if: always() && steps.bankcoworker.outputs.spill == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cas-spill-${{ env.CAS_LINEAGE }}-${{ github.run_id }}-co-worker
          path: ${{ runner.temp }}/bank/bank-spill
          compression-level: 0

      - name: Dispatch stats
        if: always()
        run: |
          echo "jobs dispatched: $(grep -c -- '-> worker ' driver.log || true)"
          grep -o -- '-> worker [0-9]*' driver.log | sort | uniq -c || true
          tail -5 driver.log

      - name: Collect buck2 event logs (per leg, download attribution)
        if: always()
        run: |
          mkdir -p evtlog
          # `log path` returns the LAST command - the dice page-out step
          # runs between build and collection, so that grabbed 2KB
          # hydration logs instead of the builds (healing5). Copy every
          # invocation's log from the isolation dir instead.
          # Single daemon: every leg's invocations share one isolation dir.
          EL=$(buck2 --isolation-dir sweep log path 2>/dev/null | tail -1 || true)
          if [ -n "$EL" ] && [ -d "$(dirname "$EL")" ]; then
            for f in "$(dirname "$EL")"/*.pb.zst; do
              [ -f "$f" ] && cp "$f" "evtlog/sweep-$(basename "$f")"
            done
          else
            echo "no event logs"
          fi
          ls -lh evtlog/ || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hetero-logs
          path: |
            driver.log
            leg-*.log
            evtlog/

    # A lost worker must not redden the run - the driver job is the
    # verdict, and the mesh tolerates stragglers.
  worker-win:
    name: win worker ${{ matrix.n }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # owns: the range this worker is PRIMARY manifest writer for
        # ('-' = secondary/read-only: serves the range, spills its new
        # blobs for the primary to absorb - one writer per manifest).
        include:
          - {n: 1, shard: 0, owns: 0}
          - {n: 2, shard: 1, owns: 1}
          - {n: 3, shard: 2, owns: 2}
          - {n: 4, shard: 3, owns: 3}
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"
      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=${REBUCK2_REV_PIN:-$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rebuck2bin
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}
      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        # Codeload tarball, not a git clone: a pin bump makes every runner
        # install at once, and 13 simultaneous git-protocol clones of one
        # small repo hit spurious EOFs fleet-wide (run 29279904483). The
        # tarball path is plain HTTPS with honest curl retries.
        run: |
          curl -fsSL --retry 8 --retry-all-errors             "${REBUCK2_GIT/github.com/codeload.github.com}/tar.gz/$REBUCK2_REV" | tar xz
          cargo install --locked --path "rebuck-$REBUCK2_REV/rebuck2"
          rm -rf "rebuck-$REBUCK2_REV"
      - name: Mount ReFS Dev Drive
        if: env.USE_DEV_DRIVE == '1'
        uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          drive-size: 24GB
          drive-format: ReFS
      # Roadmap #9 v2: preload this worker's prefix range from the CAS
      # bank (ci/cas-bank-design.md); bloom gossip announces it, the
      # driver's HasMany verifies it. Exit 3 = cold bank -> bootstrap
      # from the legacy monolithic shard artifact below.
      - name: Restore CAS bank (own range + spill absorption)
        id: bank
        env:
          GH_TOKEN: ${{ github.token }}
          ABSORB_SPILLS: ${{ matrix.owns != '-' && '1' || '' }}
        run: |
          # BANK_WORK outside the repo root: stray files in the
          # workspace churn buck2's file watcher.
          BANK_WORK="$(cygpath -u "$RUNNER_TEMP")/bank"; export BANK_WORK
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          rc=0; ./ci/cas-bank-restore.sh "$STORE/worker" "${{ matrix.shard }}" || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "cold=1" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Seed from legacy shard (cold-bank bootstrap)
        if: steps.bank.outputs.cold == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts, not the actions cache: the 10GB cache LRU evicted the
          # whole shard set within an hour (run 28932994472 died on it).
          # Public-repo artifacts don't evict and every run refreshes them.
          mkdir -p shard-in
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cas-shard-${{ matrix.shard }}&per_page=1" \
            --jq '[.artifacts[] | select(.expired==false and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].id // empty' 2>/dev/null || true)
          if [ -n "$AID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > shard.zip \
              && unzip -o -q shard.zip -d shard-in && rm -f shard.zip \
              && ls -lh shard-in/ || echo "shard artifact fetch failed - cold start"
          else
            echo "no cas-shard-${{ matrix.shard }} artifact yet - cold start"
          fi
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          mkdir -p "$STORE/worker"
