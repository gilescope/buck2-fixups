# Windows crate sweep on rebuck2 (distributed RE over iroh — gilescope/rebuck).
# HARD MODE: one driver, ONE buck2 invocation for the entire tree (base +
# conflict rigs + all snapshots — the per-leg split was only ever a workaround
# for single-runner limits), 8 workers doing all the compiling. The driver box
# never runs cl.exe/rustc — the 16 GB single-runner OOM cannot happen there —
# and it deletes runner-image ballast in the background while workers join,
# ahead of the rlib flood into its store.
# Determinism reader, take 2: same binary vs the store holding the 301. 0 dispatches = one-time re-key; repeats = non-determinism, and the repeat set names the unstable root.
# Rendezvous is keyless: driver + workers derive the driver's iroh key from
# GITHUB_RUN_ID. Opt-in only — the normal sweep is untouched.
name: sweep-re
on:
  workflow_dispatch: {}
  # workflow_dispatch only registers once this file reaches the default
  # branch; on the PR branch the trigger is a push touching this file.
  push:
    branches: [giles-rebuck2-sweep]
    paths:
      - .github/workflows/sweep-re.yml
      - ci/expected-failures-*.txt

permissions:
  contents: read

# One sweep at a time — a second trigger queues instead of doubling 15 runners.
concurrency:
  group: sweep-re
  cancel-in-progress: false

env:
  BUCK2_VERSION: 2026-06-01
  # "1": store+exec live on a ReFS Dev Drive (block-clone CoW + Defender
  # performance mode). "0": old windows mode — plain C:, NTFS hardlinks.
  USE_DEV_DRIVE: "1"
  # rebuck2 built from the rebuck repo's engine branch.
  # TODO pin to a --rev once giles-iroh-re-punch is signed/stable.
  REBUCK2_GIT: https://github.com/gilescope/rebuck
  REBUCK2_BRANCH: giles-iroh-re-punch

jobs:
  driver:
    name: driver
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # pyo3 0.24 supports python <= 3.13; the runner default is newer.
      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      # Pinned rustc: PATH-resolved toolchains are not part of action digests,
      # so warm cache hits are only honest if every run compiles with the
      # same compiler.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"

      - name: Install buck2
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-pc-windows-msvc.exe.zst" | zstd -d > "$HOME/bin/buck2.exe"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/buck2.exe" --version

      # DICE persistence ladder: if the buck2-fork workflow has parked a fork
      # binary in the cache, use it and warm-start the daemon's graph from
      # the dice snapshot. Cache miss = today's behaviour, untouched.
      - name: Restore fork buck2 (dice persistence)
        id: forkbin
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fork-bin
          key: buck2-fork-win-never-matches
          restore-keys: buck2-fork-win-

      - name: Restore dice snapshot
        if: steps.forkbin.outputs.cache-matched-key != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dice-snap
          key: dice-snap-never-matches
          restore-keys: dice-snap-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**') }}-

      - name: Enable dice persistence
        if: steps.forkbin.outputs.cache-matched-key != ''
        run: |
          cp fork-bin/buck2.exe "$HOME/bin/buck2.exe"
          "$HOME/bin/buck2.exe" --version
          echo "fork rev: $(cat fork-bin/REV 2>/dev/null || echo unknown)"
          mkdir -p dice-snap
          {
            echo "BUCK2_DICE_DB_PATH=$GITHUB_WORKSPACE/dice-snap/db"
            echo "BUCK2_DICE_SNAPSHOT_PATH=$GITHUB_WORKSPACE/dice-snap/graph.meta"
            echo "BUCK2_DICE_SNAPSHOT_SEED=$(cat fork-bin/REV 2>/dev/null)-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**') }}"
          } >> "$GITHUB_ENV"
          ls -la dice-snap/ || true
          # The binary and prelude must be version-matched: the vendored
          # prelude tracks the pinned release, so in fork mode we swap in the
          # fork's own prelude (same custom cc-rs fixes, matching version).
          echo "-- swap vendored prelude for the fork's matched one"
          git clone --quiet --depth 1 --branch giles-dice-persistence --filter=blob:none --no-checkout \
            https://github.com/gilescope/buck2 "$RUNNER_TEMP/fork-src"
          git -C "$RUNNER_TEMP/fork-src" sparse-checkout set prelude
          git -C "$RUNNER_TEMP/fork-src" checkout --quiet
          rm -rf prelude
          cp -r "$RUNNER_TEMP/fork-src/prelude" prelude
          echo "-- preflight: fork binary + fork prelude must parse the tree"
          if ! "$HOME/bin/buck2.exe" targets fixups//third-party: > /dev/null 2> probe.err; then
            echo "preflight FAILED - fork binary cannot parse the repo:"
            tail -12 probe.err
            exit 1
          fi
          echo "preflight OK"
          # Fork-mode-only skip: the newer binary's symlinked-dirs RE upload
          # trips on this crate (remote_upload_error on
          # LPTF-depsfull-symlinked_dirs.json) - upstream bug to chase.
          # Runtime-only append: release-mode sweeps still build it.
          echo "fixups//third-party:ppv-lite86-0.2" >> ci/expected-failures-Windows-x86_64.txt
          # The preflight birthed a daemon BEFORE .buckconfig.local exists;
          # RE addresses are read at daemon startup. Kill it so the build
          # step spawns a fresh daemon with the RE config (and the dice
          # snapshot load) in place.
          "$HOME/bin/buck2.exe" kill > /dev/null 2>&1 || true

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      - name: Mount ReFS Dev Drive
        if: env.USE_DEV_DRIVE == '1'
        uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          drive-size: 24GB
          drive-format: ReFS

      - name: Restore store snapshot (roadmap #5 seed)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot
          key: rebuck2-store-${{ github.run_id }}
          restore-keys: rebuck2-store-

      - name: Seed the store from the snapshot
        run: |
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          mkdir -p "$STORE/driver"
          for t in snapshot/bulk.tar.zst snapshot/tail.tar.zst; do
            if [ -f "$t" ]; then
              zstd -d < "$t" | tar -x -C "$STORE/driver"
              echo "seeded from $t ($(du -h "$t" | cut -f1))"
            fi
          done
          rm -rf snapshot; mkdir -p snapshot

      - name: Reclaim runner ballast in the background (disk for the store)
        run: |
          # The driver is network-bound once dispatch starts; spend the idle
          # cycles freeing C: for ~8000 crates of rlibs. Python stays (pinned
          # toolchain lives in hostedtoolcache).
          (rm -rf /c/Android "/c/Program Files/dotnet" \
             /c/hostedtoolcache/windows/Java* /c/hostedtoolcache/windows/go \
             /c/hostedtoolcache/windows/node /c/hostedtoolcache/windows/Ruby \
             /c/hostedtoolcache/windows/CodeQL 2>/dev/null; df -h /c) &

      - name: Start driver (remote exec only, barrier on 8 workers)
        run: |
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          rebuck2 driver --grpc-port 9092 --min-workers 8 --no-local-exec --cache-failures \
            --session "$GITHUB_RUN_ID" \
            --store "$STORE/driver" > driver.log 2>&1 &
          echo $! > driver.pid
          # The driver is network-bound; lend half its cores to the pool.
          rebuck2 worker --session "$GITHUB_RUN_ID" --slots $(($(nproc) / 2)) \
            --store "$STORE/co-worker" > co-worker.log 2>&1 &

      - name: Wait for all 8 workers to join the mesh
        run: |
          for _ in $(seq 1 180); do
            grep -q "worker 8 joined" driver.log && exit 0
            kill -0 "$(cat driver.pid)" || { cat driver.log; echo "driver died"; exit 1; }
            sleep 5
          done
          cat driver.log; echo "workers never joined"; exit 1

      - name: Point buck2 at rebuck2
        run: |
          cat > .buckconfig.local <<'EOF'
          [build]
          execution_platforms = fixups//platforms:re-exec-win

          [buck2_re_client]
          action_cache_address = grpc://127.0.0.1:9092
          cas_address = grpc://127.0.0.1:9092
          engine_address = grpc://127.0.0.1:9092
          tls = false
          EOF

      - name: Build the tree (snaps paused for iteration speed)
        env:
          # Iteration mode: skip known-failures entirely. Unset for the
          # honest full run (stale detection needs failures requested).
          SKIP_EXPECTED: "1"
        run: |
          # Overlap the bulk snapshot with the build's tail: when the driver's
          # heartbeat shows the queue nearly drained, tar the store-so-far in
          # the background; only the delta is left for after the build.
          (
            while true; do
              sleep 60
              pending=$(grep -o "pending_jobs=[0-9]*" driver.log | tail -1 | cut -d= -f2)
              [ -n "$pending" ] || continue
              total=$(grep -c -- "-> worker " driver.log || true)
              if [ "$total" -gt 1000 ] && [ "$pending" -lt 300 ]; then
                echo "[snapshot] queue draining (pending=$pending) — bulk tar starts"
                touch snapshot/.bulk-marker
                STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
                tar -c -C "$STORE/driver" ac cas | zstd -3 > snapshot/bulk.tar.zst
                echo "[snapshot] bulk done: $(du -h snapshot/bulk.tar.zst | cut -f1)"
                break
              fi
            done
          ) &
          echo $! > snapshotter.pid
          # Whole tree = //third-party/... — restore once engine iteration
          # settles. Base+conflict keeps runs ~3x shorter.
          ./build-all.sh //third-party: //third-party/conflict-rigs/...

      - name: Save dice snapshot (page-out doubles as the save point)
        if: always() && steps.forkbin.outputs.cache-matched-key != ''
        run: |
          buck2 debug hydration page-out || echo "page-out failed (non-fatal)"
          ls -lh dice-snap/ || true

      - name: Finish snapshot (delta since the bulk tar)
        if: always()
        run: |
          kill "$(cat snapshotter.pid)" 2>/dev/null || true
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          cd "$STORE/driver"
          MARKER="$GITHUB_WORKSPACE/snapshot/.bulk-marker"
          if [ -f "$GITHUB_WORKSPACE/snapshot/bulk.tar.zst" ]; then
            find ac cas -type f -newer "$MARKER" | tar -c -T - | zstd -3 \
              > "$GITHUB_WORKSPACE/snapshot/tail.tar.zst" || true
          else
            echo "[snapshot] bulk never triggered — full tar now"
            tar -c ac cas | zstd -3 > "$GITHUB_WORKSPACE/snapshot/bulk.tar.zst"
          fi
          rm -f "$MARKER"
          ls -lh "$GITHUB_WORKSPACE/snapshot/"

      - name: Save store snapshot
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: snapshot
          key: rebuck2-store-${{ github.run_id }}

      - name: Save dice snapshot cache
        if: always() && steps.forkbin.outputs.cache-matched-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dice-snap
          key: dice-snap-${{ hashFiles('rust-toolchain', 'third-party/**/BUCK', 'platforms/**') }}-${{ github.run_id }}

      - name: Dispatch stats
        if: always()
        run: |
          kill -0 "$(cat driver.pid)" 2>/dev/null || echo "*** DRIVER PROCESS DIED — check driver.log tail below ***"
          echo "jobs dispatched: $(grep -c -- '-> worker ' driver.log || true)"
          grep -o -- '-> worker [0-9]*' driver.log | sort | uniq -c || true
          grep -c "requeueing" driver.log >/dev/null 2>&1 && grep "requeueing" driver.log || true
          tail -5 driver.log

      - name: Upload driver log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-log
          path: driver.log

      - name: Stop driver
        if: always()
        run: kill "$(cat driver.pid)" 2>/dev/null || true

    # A lost worker must not redden the run - the driver job is the
    # verdict, and the mesh tolerates stragglers.
  worker:
    name: worker ${{ matrix.n }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.92.0"

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      - name: Mount ReFS Dev Drive
        if: env.USE_DEV_DRIVE == '1'
        uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          drive-size: 24GB
          drive-format: ReFS

      - name: Serve until the driver disconnects
        # Exits 0 when the driver job's process closes the control stream;
        # `timeout` guards a driver that never shows up (20400s < job cap).
        run: |
          STORE="${DEV_DRIVE:+$(cygpath -u "$DEV_DRIVE")/rebuck2}"; STORE="${STORE:-$HOME/.cache/rebuck2}"
          timeout 20400 rebuck2 worker \
            --session "$GITHUB_RUN_ID" \
            --connect-wait-secs 1800 \
            --store "$STORE/worker" | tee worker.log
