# Windows crate sweep on rebuck2 (distributed RE over iroh — gilescope/rebuck).
# HARD MODE: one driver, ONE buck2 invocation for the entire tree (base +
# conflict rigs + all snapshots — the per-leg split was only ever a workaround
# for single-runner limits), 8 workers doing all the compiling. The driver box
# never runs cl.exe/rustc — the 16 GB single-runner OOM cannot happen there —
# and it deletes runner-image ballast in the background while workers join,
# ahead of the rlib flood into its store.
# Rendezvous is keyless: driver + workers derive the driver's iroh key from
# GITHUB_RUN_ID. Opt-in only — the normal sweep is untouched.
name: sweep-re
on:
  workflow_dispatch: {}
  # workflow_dispatch only registers once this file reaches the default
  # branch; on the PR branch the trigger is a push touching this file.
  push:
    branches: [giles-rebuck2-sweep]
    paths:
      - .github/workflows/sweep-re.yml
      - ci/expected-failures-*.txt

permissions:
  contents: read

# One sweep at a time — a second trigger queues instead of doubling 15 runners.
concurrency:
  group: sweep-re
  cancel-in-progress: false

env:
  BUCK2_VERSION: 2026-06-01
  # rebuck2 built from the rebuck repo's engine branch.
  # TODO pin to a --rev once giles-iroh-re-punch is signed/stable.
  REBUCK2_GIT: https://github.com/gilescope/rebuck
  REBUCK2_BRANCH: giles-iroh-re-punch

jobs:
  driver:
    name: driver
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # pyo3 0.24 supports python <= 3.13; the runner default is newer.
      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install buck2
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/facebook/buck2/releases/download/${BUCK2_VERSION}/buck2-x86_64-pc-windows-msvc.exe.zst" | zstd -d > "$HOME/bin/buck2.exe"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/buck2.exe" --version

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      - name: Reclaim runner ballast in the background (disk for the store)
        run: |
          # The driver is network-bound once dispatch starts; spend the idle
          # cycles freeing C: for ~8000 crates of rlibs. Python stays (pinned
          # toolchain lives in hostedtoolcache).
          (rm -rf /c/Android "/c/Program Files/dotnet" \
             /c/hostedtoolcache/windows/Java* /c/hostedtoolcache/windows/go \
             /c/hostedtoolcache/windows/node /c/hostedtoolcache/windows/Ruby \
             /c/hostedtoolcache/windows/CodeQL 2>/dev/null; df -h /c) &

      - name: Start driver (remote exec only, barrier on 8 workers)
        run: |
          rebuck2 driver --grpc-port 9092 --min-workers 8 --no-local-exec \
            --session "$GITHUB_RUN_ID" \
            --store "$HOME/.cache/rebuck2/driver" > driver.log 2>&1 &
          echo $! > driver.pid

      - name: Wait for all 8 workers to join the mesh
        run: |
          for _ in $(seq 1 180); do
            grep -q "worker 8 joined" driver.log && exit 0
            kill -0 "$(cat driver.pid)" || { cat driver.log; echo "driver died"; exit 1; }
            sleep 5
          done
          cat driver.log; echo "workers never joined"; exit 1

      - name: Point buck2 at rebuck2
        run: |
          cat > .buckconfig.local <<'EOF'
          [build]
          execution_platforms = fixups//platforms:re-exec-win

          [buck2_re_client]
          action_cache_address = grpc://127.0.0.1:9092
          cas_address = grpc://127.0.0.1:9092
          engine_address = grpc://127.0.0.1:9092
          tls = false
          EOF

      - name: Build the entire tree in one buck2 invocation
        run: ./build-all.sh //third-party/...

      - name: Dispatch stats
        if: always()
        run: |
          echo "jobs dispatched: $(grep -c -- '-> worker ' driver.log || true)"
          grep -o -- '-> worker [0-9]*' driver.log | sort | uniq -c || true
          grep -c "requeueing" driver.log >/dev/null 2>&1 && grep "requeueing" driver.log || true
          tail -5 driver.log

      - name: Upload driver log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-log
          path: driver.log

      - name: Stop driver
        if: always()
        run: kill "$(cat driver.pid)" 2>/dev/null || true

  worker:
    name: worker ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      FORCE_COLOR: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Pin python for pyo3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Resolve rebuck2 rev
        id: rebuck2rev
        run: echo "rev=$(git ls-remote "$REBUCK2_GIT" "refs/heads/$REBUCK2_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache rebuck2 binary (keyed by rebuck commit)
        id: rebuck2bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/rebuck2.exe
          key: rebuck2-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.rebuck2rev.outputs.rev }}

      - name: Install rebuck2 (cache miss only)
        if: steps.rebuck2bin.outputs.cache-hit != 'true'
        env:
          REBUCK2_REV: ${{ steps.rebuck2rev.outputs.rev }}
        run: cargo install --locked --git "$REBUCK2_GIT" --rev "$REBUCK2_REV" rebuck2

      - name: Serve until the driver disconnects
        # Exits 0 when the driver job's process closes the control stream;
        # `timeout` guards a driver that never shows up (20400s < job cap).
        run: |
          timeout 20400 rebuck2 worker \
            --session "$GITHUB_RUN_ID" \
            --connect-wait-secs 1800 \
            --store "$HOME/.cache/rebuck2/worker" | tee worker.log
